packages:
  - apps/*
  - services/*
  - packages/*

# Settings live here, not in .npmrc or package.json.
engineStrict: true
saveExact: true
strictPeerDependencies: false
linkWorkspacePackages: true

# Refuse packages published in the last 24 hours. Most hijacked releases are
# caught and pulled inside that window.
minimumReleaseAge: 1440

# Install scripts run only for packages set to true. Anything unlisted fails the install until it
# has been reviewed.
allowBuilds:
  esbuild: true
  # Native speedups with pure JavaScript fallbacks. Not worth running install scripts for.
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
  # Only needed to run a Worker on this machine. A deploy uploads the code and never runs it.
  workerd: false

# One version of each shared dependency, declared once.
catalog:
  "@biomejs/biome": 2.6.6
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@hono/node-server": 2.1.6
  "@hono/zod-openapi": 1.6.3
  "@sentry/node": 10.74.0
  "@sentry/react": 10.74.0
  "@solana-program/system": 0.16.0
  "@solana/kit": 8.6.0
  "@turnkey/sdk-server": 8.9.0
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-query": 5.107.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  "@vitest/coverage-v8": 5.1.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  fast-check: 4.10.2
  hono: 4.13.17
  husky: 9.1.7
  jsdom: 30.0.1
  knip: 6.44.2
  lint-staged: 17.6.0
  pino: 10.4.0
  pino-pretty: 13.2.0
  postgres: 3.4.9
  react: 19.3.1
  react-dom: 19.3.1
  release-please: 17.11.2
  sherif: 1.13.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  tsdown: 0.23.7
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 6.0.3
  uuidv7: 1.2.1
  vite: 8.3.6
  vitest: 5.1.0
  wrangler: 4.158.0
  yaml: 2.9.1
  zod: 4.6.7

# drizzle-kit's config loader pins esbuild 0.18, which has a development server advisory. It only uses
# esbuild's transform functions, which are unchanged in 0.25.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # Advisories published against tools that only run on this machine and in CI: patched releases.
  smol-toml: ">=1.8.1"
  source-map-js: ">=1.2.2"
  handlebars: ">=4.7.10"
  # Transitive packages with published advisories: the patched releases.
  undici: "^8.12.2"
  fast-uri: "^3.1.9"
  zod: "^4.6.6"
