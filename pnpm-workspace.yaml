packages:
  # Human-facing surfaces. One desktop app today; a docs site when there is
  # something public to document.
  - "apps/*"
  # Long-running processes. The control plane lands here at slice 3, when the
  # node boundary becomes real (ADR-001).
  - "services/*"
  # Shared libraries. Anything imported from more than one place lives here,
  # explicitly so UI is built once, not per app.
  - "packages/*"

# Postinstall scripts are opt-in, which is the right default. Each of these is
# named deliberately rather than turning the protection off:
#   electron: downloads the Electron binary
#   esbuild:  downloads its native binary, used by Vite and tsx
#   node-pty: compiles. It is a native module because a pseudoterminal is a
#             kernel feature, and ADR-003 section 3.1 names it as the human
#             terminal's mechanism. It never runs on a worker's path.
allowBuilds:
  electron: true
  # Windows installer tooling, pulled in by electron-builder. Nothing here builds
  # for Windows, so it has no reason to run anything.
  electron-winstaller: false
  esbuild: true
  node-pty: true

minimumReleaseAgeExclude:
  - electron@44.3.0

# Monaco pins dompurify 3.4.8, which carries two moderate XSS advisories
# (GHSA-cmwh-pvxp-8882 and GHSA-55q2-fjhq-7xh7). 0.56.0 is the latest Monaco, so
# there is no version of it to upgrade to, and the fix is a patch release of the
# transitive dependency. Remove this when Monaco ships a version that pins one.
overrides:
  dompurify: "^3.4.15"
