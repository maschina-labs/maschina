packages:
  - apps/*
  - services/*
  - packages/*

# Settings live here, not in .npmrc or package.json.
engineStrict: true
saveExact: true
strictPeerDependencies: false
linkWorkspacePackages: true

# Refuse packages published in the last 24 hours. Most hijacked releases are
# caught and pulled inside that window.
minimumReleaseAge: 1440

# Install scripts run only for packages set to true. Anything unlisted fails the install until it
# has been reviewed.
allowBuilds:
  esbuild: true
  # Native speedups with pure JavaScript fallbacks. Not worth running install scripts for.
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false

# One version of each shared dependency, declared once.
catalog:
  "@biomejs/biome": 2.5.14
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@hono/node-server": 2.1.1
  "@hono/zod-openapi": 1.6.3
  "@sentry/node": 10.74.0
  "@sentry/react": 10.74.0
  "@solana-program/system": 0.15.0
  "@solana/kit": 8.3.0
  "@turnkey/sdk-server": 8.6.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.103.2
  "@tanstack/react-router": 1.170.39
  "@tanstack/router-plugin": 1.168.40
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.13.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  "@vitest/coverage-v8": 5.0.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  fast-check: 4.10.2
  hono: 4.13.9
  husky: 9.1.7
  jsdom: 30.1.1
  knip: 6.38.0
  lint-staged: 17.5.1
  pino: 10.3.1
  pino-pretty: 13.1.3
  postgres: 3.4.9
  react: 19.3.0
  react-dom: 19.3.0
  release-please: 17.11.2
  sherif: 1.13.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.4
  typescript: 6.0.3
  uuidv7: 1.2.1
  vite: 8.3.1
  vitest: 5.0.2
  yaml: 2.9.1
  zod: 4.6.5

# drizzle-kit's config loader pins esbuild 0.18, which has a development server advisory. It only uses
# esbuild's transform functions, which are unchanged in 0.25.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
