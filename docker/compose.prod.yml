# Maschina on one server.
#
# Nothing here publishes a port. The daemon talks to the orchestrator over the private network, the
# orchestrator talks to the signer, and the only way in from outside is SSH. The one thing the world can
# reach is the API, and it reaches it through a Cloudflare Tunnel that dials out from this box: the
# gateway is never listening on the internet, and there is no certificate to renew. Images come from the
# registry, tagged with the release being run, so a rollback is a version change and nothing is built on
# the server.

name: maschina

services:
  postgres:
    image: postgres:17-alpine
    container_name: maschina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maschina_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?the database password is required}
      POSTGRES_DB: maschina
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maschina_owner -d maschina"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Run once per deploy, before the new code starts, and never left running. `update.sh` invokes it.
  migrator:
    image: ghcr.io/maschina-labs/migrator:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-migrator
    restart: "no"
    profiles: ["migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgres://maschina_owner:${POSTGRES_PASSWORD:?the database password is required}@postgres:5432/maschina
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    image: ghcr.io/maschina-labs/orchestrator:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-orchestrator
    restart: unless-stopped
    env_file: /opt/maschina/.env
    environment:
      SIGNER_URL: http://signer:4200
    depends_on:
      postgres:
        condition: service_healthy

  signer:
    image: ghcr.io/maschina-labs/signer:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-signer
    restart: unless-stopped
    env_file: /opt/maschina/.env
    depends_on:
      postgres:
        condition: service_healthy

  provisioner:
    image: ghcr.io/maschina-labs/provisioner:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-provisioner
    restart: unless-stopped
    env_file: /opt/maschina/.env
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: ghcr.io/maschina-labs/gateway:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-gateway
    restart: unless-stopped
    env_file: /opt/maschina/.env
    environment:
      PROVISIONER_URL: http://provisioner:4400
    depends_on:
      postgres:
        condition: service_healthy

  # The only way in. It dials Cloudflare, so the box still has no open port, and it is the reason the
  # gateway reads cf-connecting-ip: every request arrives from this container's address otherwise.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: maschina-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?the tunnel token is required}
    depends_on:
      - gateway

  daemon:
    image: ghcr.io/maschina-labs/daemon:${MASCHINA_VERSION:?the version to run is required}
    container_name: maschina-daemon
    restart: unless-stopped
    env_file: /opt/maschina/.env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:4100
      DAEMON_IDENTITY_PATH: /home/node/.maschina/daemon-identity.json
    volumes:
      # The node's identity, so a restart is the same node rather than a new one.
      - daemon-identity:/home/node/.maschina
    depends_on:
      - orchestrator

volumes:
  postgres-data:
  daemon-identity:
