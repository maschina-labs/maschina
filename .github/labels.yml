# The label set, kept in the repository so it is reviewable rather than clicked
# into existence and forgotten. Apply with:
#   gh label create <name> --color <color> --description <desc>

- name: bug
  color: d73a4a
  description: Something behaves differently than it should
- name: design
  color: 8250df
  description: A claim in the architecture may not hold
- name: feature
  color: 0e8a16
  description: Something Maschina should be able to do
- name: slice
  color: 1d76db
  description: A Stage 0 slice
- name: proof
  color: fbca04
  description: Work on a proof criterion
- name: repo
  color: 5319e7
  description: Tooling, CI, or repository configuration
- name: docs
  color: 0075ca
  description: Documentation only
- name: no-changelog
  color: e4e669
  description: Deliberately has no changelog entry. Say why in the body
- name: blocked
  color: b60205
  description: Waiting on something else
- name: out-of-scope
  color: cfd3d7
  description: Reasonable, and not until the foundation is proven
