name: Task
description: Planned work on the roadmap
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that prove it, run against the real thing.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Dependencies, risks, anything to watch for.
