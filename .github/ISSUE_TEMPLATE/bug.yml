name: Bug
description: Something behaves differently than it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. pnpm db:up
        2. pnpm maschina event append --actor me --type test
        3. ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error output, the relevant part of the event log, or the failing proof.
      render: shell

  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit you are on.
    validations:
      required: true
