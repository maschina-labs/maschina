name: Feature
description: Something Maschina should be able to do
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
