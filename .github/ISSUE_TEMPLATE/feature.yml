name: Feature
description: Something Maschina should be able to do
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Maschina's scope is deliberately narrow right now, and a lot of
        reasonable ideas are out of scope on purpose until the foundation is
        proven. Open this anyway if it matters, but expect "not yet" to be a
        common answer.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today. Not the solution, the problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
