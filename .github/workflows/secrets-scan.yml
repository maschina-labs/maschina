name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: a secret committed and later removed is still a leak.
          fetch-depth: 0

      # The official gitleaks action requires a paid licence key for
      # organisation-owned repositories. The binary does not, so run it
      # directly. Same scanner, same config, no licence.
      - name: Install gitleaks
        run: |
          VERSION=8.30.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1
