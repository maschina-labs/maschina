name: Dependency review

# Only a change to dependencies can bring in a new one.
on:
  pull_request:
    paths:
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/**
      - .github/actions/**
      - "**/Dockerfile"

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
          # Advisories judged not to apply, each with its reason next to the matching pnpm auditConfig entry.
          # A test keeps this list and pnpm's in step.
          allow-ghsas: GHSA-528h-pc64-c93x
