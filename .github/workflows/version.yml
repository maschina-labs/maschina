name: Version

# Every merge to main decides its own version. The commit subjects are already
# required to be conventional commits, and squash merging makes the pull request
# title the subject, so the number follows from a rule that is already enforced
# rather than from someone remembering to run a command.
#
# The release lands as a pull request rather than a push to main. Pushing
# straight to main would need the bot to bypass the branch ruleset, and GitHub
# refuses to make its own Actions app a bypass actor on a repository ruleset
# anyway. The pull request is the better answer regardless: the release goes
# through the same checks as everything else, and nothing gets a way around
# them.

on:
  # Every merge that earns a version gets one, immediately. The tags are the
  # ledger: reading them back should say what happened and when, one line per
  # change, rather than lumping an afternoon into a single number.
  #
  # It used to open a release pull request, which doubled the pull requests for
  # every change and cost a preview build each time. The answer to that was never
  # to release less often. It was to stop the release needing a pull request.
  #
  # So nothing is committed back to main. The tag is the version. A merge that
  # earns no bump, docs and chores and CI, produces nothing and that is correct.
  push:
    branches: [main]
  workflow_dispatch:

# Read only at the top, so a job added without thinking gets nothing.
permissions:
  contents: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  release:
    name: Tag the merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # A push made with GITHUB_TOKEN starts no workflows, and a tag that
          # starts nothing is a tag nothing publishes. This belongs to a person.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Work out the next version
        id: next
        run: node .github/ci/next-version.mjs

      - name: Tag it
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists."
            exit 0
          fi
          # Tags sit outside the branch ruleset, which targets the default
          # branch, so this needs no bypass and no signature.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
