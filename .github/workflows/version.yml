name: Version

# Every merge to main decides its own version. The commit subjects are already
# required to be conventional commits, and squash merging makes the pull request
# title the subject, so the number follows from a rule that is already enforced
# rather than from someone remembering to run a command.
#
# feat is a minor, fix and perf and refactor and revert and dependency bumps are
# a patch, and anything that cannot change behaviour (docs, ci, test, chore) is
# no release at all. A version that moves without behaviour changing makes the
# number mean less.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    name: Cut the version this merge earned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Without this the release commit would trigger this workflow again.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Work out the next version
        id: next
        run: node .github/ci/next-version.mjs

      - name: Roll the changelog and bump the version
        if: steps.next.outputs.version != ''
        run: node .github/ci/prepare-release.mjs "${{ steps.next.outputs.version }}"

      - name: Commit and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          # The identity is the workflow, not a person. Nobody wrote this commit
          # and pretending otherwise would put a name on a machine's work.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main
          git push origin "v$VERSION"
