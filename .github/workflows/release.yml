name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        run: |
          # The release notes are the hand-written changelog section, not a list
          # of commit subjects. If a version has no section, that is a mistake
          # worth failing on rather than papering over with generated text.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found              { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No changelog section for $VERSION in CHANGELOG.md."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
