name: Release

on:
  push:
    tags: ["v*"]

# Read only at the top. The one job that publishes asks for the rest.
permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads the source archive.
      contents: write
      # Build provenance: a signed statement that this artifact was produced by
      # this workflow, from this commit. Verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Work out the release notes
        id: notes
        run: |
          # The notes are the changelog lines this release added, not a list of
          # commit subjects. Taken from the diff rather than from a committed
          # section heading, because nothing commits back to main any more: the
          # tag is the version, and asking a release to also write a file would
          # put the pull request back that this removed.
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

          if [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS".."$GITHUB_REF_NAME" -- CHANGELOG.md \
              | grep '^+' | grep -v '^+++' | sed 's/^+//' \
              | grep -v '^## \[' > notes.md || true
          fi

          # A release with nothing hand written is a release nobody can read, so
          # say that plainly rather than shipping an empty body.
          if [ ! -s notes.md ]; then
            echo "No changelog entries were added for this release." > notes.md
            echo "" >> notes.md
            echo "What changed:" >> notes.md
            git log --format='- %s' "${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME" >> notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the source archive
        id: archive
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          # Attesting needs something that has a sha256. The commit sha is a
          # SHA-1 and the attest action rejected it, which is right: a git sha
          # names a tree, it is not a digest of an artifact anybody downloads.
          NAME="maschina-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="maschina-$VERSION/" -o "$NAME" HEAD
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest the source archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.archive.outputs.name }}
          subject-digest: sha256:${{ steps.archive.outputs.digest }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            "${{ steps.archive.outputs.name }}"
