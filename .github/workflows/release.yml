name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance: a signed statement that this artifact was produced by this
  # workflow, from this commit. Verifiable with `gh attestation verify`.
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        run: |
          # The release notes are the hand-written changelog section, not a list
          # of commit subjects. If a version has no section, that is a mistake
          # worth failing on rather than papering over with generated text.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found              { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No changelog section for $VERSION in CHANGELOG.md."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attest the source tree
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: maschina-${{ steps.notes.outputs.version }}
          subject-digest: sha256:${{ github.sha }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
