name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance: a signed statement that this artifact was produced by this
  # workflow, from this commit. Verifiable with `gh attestation verify`.
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        run: |
          # The release notes are the hand-written changelog section, not a list
          # of commit subjects. If a version has no section, that is a mistake
          # worth failing on rather than papering over with generated text.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found              { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No changelog section for $VERSION in CHANGELOG.md."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the source archive
        id: archive
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          # Attesting needs something that has a sha256. The commit sha is a
          # SHA-1 and the attest action rejected it, which is right: a git sha
          # names a tree, it is not a digest of an artifact anybody downloads.
          NAME="maschina-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="maschina-$VERSION/" -o "$NAME" HEAD
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest the source archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.archive.outputs.name }}
          subject-digest: sha256:${{ steps.archive.outputs.digest }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            "${{ steps.archive.outputs.name }}"
