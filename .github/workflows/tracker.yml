# Does GitHub still agree with the repository?
#
# Drift is quiet, and it is the failure this project exists to avoid. The
# previous implementation marked roughly sixty capabilities built while its own
# logs showed nothing had ever run. A roadmap nobody prunes fails the same way,
# just more slowly.
#
# Runs weekly, and files one issue when it finds something. Never fails a build.
name: Tracker

on:
  schedule:
    # Monday morning, so the week starts with an honest list.
    - cron: "0 13 * * 1"
  # Anything that closes an issue should be reflected on the board within
  # minutes, not next Monday.
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # GitHub's own project workflows cannot be toggled through any API, so this
  # does their job instead: every issue on the board, with a status derived from
  # its labels and milestone rather than typed by anyone. Being a script means it
  # is versioned, reviewable, and cannot be silently switched off in a settings
  # page nobody looks at.
  board:
    name: Put every issue on the board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync the board
        env:
          # Needs a token with the project scope. GITHUB_TOKEN cannot write to an
          # organisation project, whatever its permissions block says.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No token with project scope. Set PROJECT_TOKEN and this starts working."
            exit 0
          fi
          # A missing scope is a configuration problem, not a broken build.
          node internal/operations/sync-board.mjs || {
            echo "Board sync failed. Usually a token without the project scope."
            exit 0
          }

  drift:
    name: Check for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Look for drift
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node internal/operations/check-tracker.mjs > drift.txt 2>&1
          echo "drifted=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      # One open issue at a time. A weekly job that opens a new issue every week
      # is a weekly job nobody reads by March.
      - name: File it, or update the one already open
        if: steps.check.outputs.drifted != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The tracker and the repository disagree. Each line below is either"
            echo "something to fix or something to decide."
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "Found by \`internal/operations/check-tracker.mjs\`, which runs every Monday."
          } > body.md

          EXISTING=$(gh issue list --state open --label repo \
            --search "Tracker drift in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "Tracker drift" --body-file body.md --label repo
          fi
