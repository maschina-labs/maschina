name: CodeQL

# Changes that hold no code are skipped. The weekly run scans everything regardless.
on:
  pull_request:
    paths-ignore: &no-code
      - "**/*.md"
      - .release-please-manifest.json
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
  push:
    branches: [main]
    paths-ignore: *no-code
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript, actions
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
