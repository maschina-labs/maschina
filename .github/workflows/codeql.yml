name: CodeQL

# Changes that hold no code are skipped. The weekly run scans everything regardless.
on:
  pull_request:
    paths-ignore: &no-code
      - "**/*.md"
      - .release-please-manifest.json
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
  push:
    branches: [main]
    paths-ignore: *no-code
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript, actions
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
