name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new rule set finds old code rather than only new code.
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning needs GitHub Advanced Security on a private repository, and
    # this one is private for now. The job skips rather than failing every run,
    # and starts working by itself the moment the repo goes public.
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
