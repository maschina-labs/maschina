name: Deploy

# Every release goes to the server, so what is running is always what was released. The server pulls the
# images it was told to run; nothing is built here, and no secrets leave the box.

on:
  # After the images, never beside them. Both used to start on the release, so the server pulled a tag
  # that was still being built and the deploy failed on an image that did not exist yet.
  workflow_run:
    workflows: [Images]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: The version to run, for example 0.0.19
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed image build has nothing to deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out which version to run
        id: version
        env:
          # The images run on a release, so its tag is the branch that run was for.
          TAG: ${{ github.event.workflow_run.head_branch }}
          ASKED: ${{ inputs.version }}
        run: |
          version="${ASKED:-${TAG#v}}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a released version; nothing to deploy."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update the server
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > /tmp/deploy.key
          ssh_opts="-i /tmp/deploy.key -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          # The release carries its own compose file and scripts, so the box runs what the release says
          # it runs. Without this they go to the server by hand and quietly fall behind.
          # shellcheck disable=SC2086
          scp $ssh_opts docker/compose.prod.yml docker/compose.migrate.yml \
            scripts/server/update.sh scripts/server/backup.sh "ubuntu@$HOST:/opt/maschina/"
          # shellcheck disable=SC2086
          ssh $ssh_opts "ubuntu@$HOST" "chmod +x /opt/maschina/*.sh && /opt/maschina/update.sh $VERSION"
          rm -f /tmp/deploy.key
