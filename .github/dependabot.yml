version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR a week for the routine bumps, rather than one per package. The
      # first push produced six separate PRs in ninety seconds, which is noise
      # for a repository with one person in it.
      routine:
        update-types: [minor, patch]

    ignore:
      # No automatic major bumps, for anything.
      #
      # An earlier version of this listed packages individually: vite, because
      # electron-vite@5 supports Vite 5 to 7 only. It missed
      # @vitejs/plugin-react, whose version 6 requires Vite 8 and would have
      # broken the desktop build through the back door. An allowlist of things
      # that can hurt you will always be missing the next one.
      #
      # Majors get read and taken deliberately. Minor and patch still arrive
      # grouped, weekly, and are safe to merge on green.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
