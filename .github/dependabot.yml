version: 2

# Routine updates arrive once a month, one grouped pull request per group. Security fixes ignore this
# schedule and arrive as soon as an advisory is published.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Matches minimumReleaseAge in pnpm-workspace.yaml: never propose a version less than a day old.
    cooldown:
      default-days: 1
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    # A new major version of Node or TypeScript is a deliberate upgrade with its own issue.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/gateway
      - /services/orchestrator
      - /services/signer
      - /services/daemon
      - /services/bots
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: build
    # Services stay on the Node long-term support line until an upgrade issue moves them.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      node-image:
        patterns: ["*"]
