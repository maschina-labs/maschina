version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Matches minimumReleaseAge in pnpm-workspace.yaml: never propose a version less than a day old.
    cooldown:
      default-days: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/gateway
      - /services/orchestrator
      - /services/signer
      - /services/daemon
      - /services/bots
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      node-image:
        patterns: ["*"]
